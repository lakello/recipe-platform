apiVersion: v1
kind: LimitRange
metadata:
  name: container-defaults
  namespace: recipe-dev
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: 100m
        memory: 128Mi
      default:
        cpu: 500m
        memory: 512Mi

---

